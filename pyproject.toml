[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-github"
version = "0.1.0.dev0"
description = "GitHub retriever and loaders for LangChain: query-driven search over repo code, docs, issues and discussions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["langchain", "github", "retriever", "rag", "document-loader", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "httpx>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "respx>=0.21",
    "langchain-tests>=0.3",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/daivikawasthi01/langchain-github"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_github"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"eval/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits the real GitHub API (set GITHUB_LIVE=1)"]
